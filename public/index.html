<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>視聴画面</title>
    <link rel="stylesheet" href="/styles.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/hls.js@1.7.1/dist/hls.min.js"
      integrity="sha384-X6qxWXYhVZFp6V31bNDBz4eOoPnZloPbOdTcnhnvRJY2+2pDMrO7R4/1mXfJ9VXY"
      crossorigin="anonymous"
      defer
    ></script>
    <script src="/main.js" defer></script>
  </head>
  <body>
    <div class="watch-shell">
      <div class="stage">
        <div class="video-wrap">
          <div id="video-area" class="video-stage">
            <video id="live-video" class="video-surface" muted playsinline></video>

            <div class="video-overlay action-rail">
              <button type="button" class="rail-btn like-btn" aria-label="いいね">
                <span class="rail-icon"><svg viewBox="0 0 24 24" class="icon"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></span>
              </button>
              <button type="button" class="rail-btn share-btn">
                <span class="rail-icon"><svg viewBox="0 0 24 24" class="icon"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg></span>
                <span class="rail-count">シェア</span>
              </button>
              <button type="button" class="rail-btn gift-btn">
                <span class="rail-icon"><svg viewBox="0 0 24 24" class="icon"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13"/><path d="M19 8V6a3 3 0 0 0-6-1 3 3 0 0 0-6 1v2"/></svg></span>
                <span class="rail-count">アイテム</span>
              </button>
            </div>

            <div class="video-overlay playback-bar">
              <button type="button" class="icon-btn play-btn">
                <svg viewBox="0 0 24 24" class="icon"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
              </button>
              <button type="button" class="icon-btn mute-btn">
                <svg viewBox="0 0 24 24" class="icon"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
              </button>
              <button type="button" class="icon-btn fullscreen-btn">
                <svg viewBox="0 0 24 24" class="icon"><path d="M8 3H3v5"/><path d="M21 8V3h-5"/><path d="M3 16v5h5"/><path d="M16 21h5v-5"/></svg>
              </button>
            </div>
          </div>
        </div>

        <aside class="comment-panel">
          <ul class="comment-list">
          </ul>

          <form class="comment-form">
            <div class="item-shortcuts">
              <button type="button" class="item-shortcut">🎁</button>
              <button type="button" class="item-shortcut">⭐</button>
              <button type="button" class="item-shortcut">👏</button>
            </div>
            <div class="comment-input-row">
              <input type="text" class="comment-input" placeholder="コメントを入力" />
              <button type="submit" class="send-btn" aria-label="送信">
                <svg viewBox="0 0 24 24" class="icon"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
              </button>
            </div>
          </form>
        </aside>
      </div>
    </div>
  </body>
</html>
